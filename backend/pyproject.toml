[project]
name = "smart-student-part-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0.0",
    "Flask-CORS>=4.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "PyMySQL>=1.1.0",
    "mysql-connector-python>=8.2.0",
    "Werkzeug>=3.0.0",
    "PyJWT>=2.8.0",
    "python-dotenv>=1.0.0",
    "cloudinary>=1.36.0",
]

[tool.vercel]
entrypoint = "app:app"
