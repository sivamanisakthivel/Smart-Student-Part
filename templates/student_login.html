{% extends "base.html" %}

{% block title %}Student Login - CampusJobs{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="form-card">
                <div class="text-center mb-4">
                    <div class="stat-icon mx-auto mb-3">
                        <i class="fa-solid fa-right-to-bracket"></i>
                    </div>
                    <h2 class="fw-bold text-dark mb-1">Student Portal Login</h2>
                    <p class="text-muted small">Access your profile and track job applications</p>
                </div>

                <form action="{{ url_for('student_login') }}" method="POST" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label font-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="student@college.edu" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label font-semibold mb-0">Password</label>
                            <a href="{{ url_for('forgot_password') }}" class="small text-primary text-decoration-none">Forgot Password?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3">
                        <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Log In
                    </button>
                </form>

                <div class="text-center mb-3">
                    <a href="{{ url_for('student_login_otp') }}" class="btn btn-outline-custom w-100 py-2">Login with OTP</a>
                </div>

                <div class="text-center border-top pt-3">
                    <p class="text-muted mb-0 small">Don't have a student account? <a href="{{ url_for('student_register') }}" class="text-primary font-semibold text-decoration-none">Register Now</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
